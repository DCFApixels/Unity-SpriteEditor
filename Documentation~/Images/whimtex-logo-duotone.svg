      <stop offset="0.7" stop-color="#202124" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#202124" stop-opacity="0"/>
    </radialGradient>
    <filter id="halo-shadow" filterUnits="userSpaceOnUse" x="-64" y="-64" width="1382" height="1382" color-interpolation-filters="sRGB">
