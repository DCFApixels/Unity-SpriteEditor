<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" role="img" aria-labelledby="title desc">
  <title id="title">WhimTex manta — two-tone</title>
  <desc id="desc">White WhimTex manta with charcoal eyes, bold separating contours and a soft surrounding shadow. Transparent background; editable vector shapes.</desc>
  <defs>
