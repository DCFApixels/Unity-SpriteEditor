      <feOffset in="halo-blur" dx="0" dy="10" result="halo-alpha"/>
      <feFlood flood-color="#202124" flood-opacity="0.75" result="halo-color"/>
      <feComposite in="halo-color" in2="halo-alpha" operator="in" result="halo"/>
      <feMerge>
        <feMergeNode in="halo"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
