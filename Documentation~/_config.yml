title: Unity Sprite Editor
description: Layered sprites and textures, directly inside Unity.
url: https://dcfapixels.github.io
baseurl: /Unity-SpriteEditor
repository: DCFApixels/Unity-SpriteEditor
theme: just-the-docs
permalink: pretty
color_scheme: sprite
lang: en

plugins:
  - jekyll-relative-links

defaults:
  - scope:
      path: ""
    values:
      layout: default
      lang: en

search_enabled: true
search:
  heading_level: 3
  previews: 2
  rel_url: true
  focus_shortcut_key: k

heading_anchors: true
enable_copy_code_button: true
back_to_top: false
gh_edit_link: false
aux_links:
  GitHub:
    - https://github.com/DCFApixels/Unity-SpriteEditor
  Discord:
    - https://discord.gg/kqmJjExuCf

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - scripts
  - .bundle
  - .jekyll-cache
  - .sass-cache
  - _site
